<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404, Harish Suresh</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <!-- Served by the host for any missing path, so every URL here is
         root-absolute. Colours are copies of the site's tokens; keep them in
         step with index.html if the palette changes. -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark")
          document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <style>
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 400 700;
        font-display: swap;
        src: url("/assets/fonts/jetbrains-mono-latin.woff2") format("woff2");
      }
      :root {
        --bg: #0b0a08;
        --surface: #1a1813;
        --text: #e9e8e3;
        --text-muted: #b4b1a8;
        --text-dim: #8a8880;
        --border: #282622;
        --accent: #4dbf74;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]) {
          --bg: #faf9f6;
          --surface: #ffffff;
          --text: #15140f;
          --text-muted: #4b4942;
          --text-dim: #635f56;
          --border: #cfc8b8;
          --accent: #1a6238;
          color-scheme: only light;
        }
      }
      :root[data-theme="light"] {
        --bg: #faf9f6;
        --surface: #ffffff;
        --text: #15140f;
        --text-muted: #4b4942;
        --text-dim: #635f56;
        --border: #cfc8b8;
        --accent: #1a6238;
        color-scheme: only light;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: "JetBrains Mono", ui-monospace, monospace;
      }
      .term {
        width: min(640px, 100%);
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        overflow: hidden;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        color: var(--text-dim);
      }
      .bar a {
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
      }
      .bar .slash {
        color: var(--accent);
      }
      .out {
        padding: 22px 18px 24px;
        font-size: 14px;
        line-height: 1.8;
        overflow-wrap: anywhere;
      }
      .ps1 {
        color: var(--accent);
      }
      .err {
        color: var(--text-muted);
        margin-bottom: 14px;
      }
      .ls a {
        color: var(--text);
        text-decoration: none;
        margin-right: 16px;
        border-bottom: 1px solid var(--border);
      }
      .ls a:hover,
      .home:hover {
        color: var(--accent);
        border-color: var(--accent);
      }
      .home {
        display: inline-block;
        margin-top: 22px;
        padding: 10px 16px;
        border: 1px solid var(--border);
        border-radius: 4.8px;
        color: var(--text);
        text-decoration: none;
      }
      .caret {
        display: inline-block;
        width: 8px;
        height: 1.05em;
        vertical-align: -3px;
        background: var(--accent);
        animation: blink 1.1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .caret {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="term">
      <div class="bar">
        <a href="/">harish<span class="slash">/</span>suresh</a><span>404</span>
      </div>
      <div class="out">
        <div><span class="ps1">~ $</span> cd <span id="path">/this-page</span></div>
        <div class="err">bash: cd: <span id="path2">/this-page</span>: No such file or directory</div>
        <div><span class="ps1">~ $</span> ls</div>
        <div class="ls">
          <a href="/#work">skills/</a><a href="/#experience">experience/</a
          ><a href="/#projects">projects/</a><a href="/#contact">contact/</a>
        </div>
        <a class="home" href="/">cd ~</a>
        <div style="margin-top: 18px"><span class="ps1">~ $</span> <span class="caret"></span></div>
      </div>
    </main>
    <script>
      /* The missing path, shown as text only (never as HTML). */
      var p = location.pathname || "/";
      try {
        p = decodeURIComponent(p);
      } catch (e) {} /* malformed %-escapes: show the raw path */
      if (p.length > 60) p = p.slice(0, 57) + "...";
      document.getElementById("path").textContent = p;
      document.getElementById("path2").textContent = p;
    </script>
  </body>
</html>
